<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">

<style>

:focus-visible{outline:3px solid var(--t);outline-offset:2px}

main{padding:20px 14px 120px}h1,.hero h1{font-size:28px}.hero h1,.hero>.m{padding-right:92px}.ring{width:76px;height:76px}.ring b{font-size:20px}
input[type=number],input.s{width:72px}.cal div{min-height:54px;font-size:10px;padding:5px 3px}#toast,#rest{bottom:104px}}

option{background:#14141f;color:#f5f5fa}.card,.exrow{backdrop-filter:blur(14px)}#rest{background:#1a1a26}

.tile{cursor:pointer}.tile .big{font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:6px 0 2px}.tile .big small{font-size:15px;color:var(--m);font-weight:600}
.pv{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.pv span{background:#fff2;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:600}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.pill{padding:10px 2px;text-align:center;border-radius:18px;background:var(--p);border:1px solid var(--l);cursor:pointer;font-size:11px;color:var(--m);backdrop-filter:blur(14px)}
.pill b{display:block;font-size:18px;color:var(--t);margin:2px 0}.pill i{display:block;width:8px;height:8px;border-radius:50%;margin:4px auto 0}.pill.td{border-color:var(--t)}.pill.ok{background:color-mix(in srgb,var(--g) 18%,transparent)}
@media(max-width:760px){.bento{grid-template-columns:1fr 1fr}.s6,.s2.w{grid-column:span 2}.s2{grid-column:span 1}.strip{gap:4px}nav{background:#14141fe6!important}.who{display:none}}

nav button i{display:grid;place-items:center}
.seg{display:flex;gap:4px;padding:4px;background:var(--p2);border-radius:99px;margin:6px 0 18px;width:100%;max-width:440px}
.seg button{flex:1;border:0;background:none;color:var(--m);padding:8px;border-radius:99px;font:inherit;font-weight:700;cursor:pointer;min-height:42px}.seg button.on{background:var(--t);color:#07070d}
@media(max-width:760px){nav{left:8px;right:8px;padding:6px 4px}nav button{padding:8px 0;font-size:11px;gap:3px}nav button svg{width:24px;height:24px}.seg{max-width:none}.wk{grid-template-columns:1fr 1fr}.card{padding:14px}}
.seg{overflow-x:auto}.seg button{white-space:nowrap;flex:none;padding:8px 14px}
.mus:hover,.mus:focus{filter:brightness(1.25) drop-shadow(0 0 6px #fff6);outline:none}
.mus[data-key].active{stroke:#fff;stroke-width:2.5}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Istanbul'});
const dn=s=>{const[y,m,d]=s.split('-');return Date.UTC(y,m-1,d)/864e5};
const add=(s,n)=>new Date((dn(s)+n)*864e5).toISOString().slice(0,10);
const dow=s=>(new Date(dn(s)*864e5).getUTCDay()+6)%7; // Pazartesi=0
const GUN=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const AY=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const SAAT=['18:30–20:30','Okul sonrası','18:30–20:30','18:40 sonrası','18:40 sonrası','18:30–20:30','Dinlenme / koşu'];
const COL={bilek:'#4f8cff',basinc:'#ff5a5a',onbilek:'#a46bff',rotasyon:'#ff9a3c',gogus:'#4cc36b',sirt:'#31cfd8',kolbacak:'#f2d03b',kol:'#f2d03b',bacak:'#c9b02e',masa:'#ff7ac0',dinlen:'#8a8a92'};
const WARN={basinc:'Side pressure: dirsek ve üst kolda yüksek yük oluşur. Isınmayı atlama.',sirt:'Ağır sırt çalışması ertesi günkü rotasyon/bilek antrenmanını etkileyebilir.',kolbacak:'Cumartesi masa antrenmanı var: kol hacmi bilerek azaltıldı.',kol:'Tam kol programı cumartesi masa performansını etkileyebilir.',onbilek:'Ağır biceps çalışmasından sonra ön bilek için toparlanmaya dikkat et.'};
function mk(){const x=(a)=>a.map(([n,s,r,l])=>({id:uid(),n,s,r,l}));
const M='Maksimum',oh='Orta-hafif',oa='Orta-ağır',ao='Ağır-orta';
const bac=[['Squat veya leg press',3,'4–6','Ağır'],['Romanian deadlift',3,'6–8','Orta-ağır'],['Leg curl',3,'8–12','Orta'],['Calf raise',3,'10–15','Orta']];
const kolHafif=[['Z bar biceps',2,'8–10','Hafif-orta'],['Triceps iple',2,'10–12','Hafif-orta']];
return{
bilek:{name:'Bilek Antrenmanı',ex:x([['İstasyonda bilek rotasyonda lastik ekle, yerinde içe döndür',4,M,oh],['Sehpada bilek',4,M,oa],['İstasyonda parmak',4,M,oh],['Yerden sırta bilek döndürerek dumbbell kaldırma',4,M,oa],['İstasyonda lastikle içe hızlı yuvarlama',4,M,oh],['İstasyonda iple eklem',4,M,oa],['İstasyonda ters basınç',4,'4–6',M],['Statik ağırlıklı barfiks (2 set ağırlıklı, 1 set ağırlıksız)',3,'Statik',M]])},
basinc:{name:'Basınç Antrenmanı',ex:x([['İstasyonda lastikle yana yuvarlama',4,M,oa],['Demir çubukla iple aşağıdan yukarı basınç',4,M,oa],['İstasyonda iple eklem',4,M,oa],['Parmak',4,M,M],['İstasyonda çaprazdan iple statik',4,'1',ao],['İstasyonda üstüne çıkıp yana basınç',4,M,ao]])},
onbilek:{name:'Ön Bilek Antrenmanı',ex:x([['İstasyonda karşıdan iki ipi kemiğin arasına alıp lastikle ön bilekten kendine çekme',4,M,oa],['Yerden iple ön bilek',4,'4–8',oa],['İstasyonda çapraz koyup iple kemik hizasından basma',4,M,oa],['Yerden iple kemik hizasından bilek rotasyonu ekleyerek dış çekiş',4,M,oa],['İstasyonda dış aletiyle yuvarlayıp ön bileği salıp yuvarlama',4,M,oh],['Parmak',4,M,M],['Ağırlıklı barfiks, statik hammer tutuş (2 set ağırlıklı, 1 set ağırlıksız)',3,'Statik',M]])},
rotasyon:{name:'Rotasyon Antrenmanı',ex:x([['İstasyonda içe yuvarlama aleti ve lastikle kendine çekerek dış rotasyon',4,M,oa],['İple rotasyon, bilek hizasına destek koyarak',4,M,'Hafif-orta'],['İstasyonda yan pozisyonda karşıdan lastikle çekerek yana yatış',4,M,oa],['İple hammer',4,M,ao],['Parmak',4,M,oa],['İstasyonda karşıdan çekerek savunma rotasyonu',4,M,oa]])},
sirt:{name:'Sırt + Triceps + Omuz',ex:x([['Lat pulldown',3,'6–8','S.K.'],['Üstten yakın tutuş demirle çekiş',3,'6–8','S.K.'],['Karşıdan düz yakın tutuş demirle çekiş',2,'6–8','S.K.'],['Row düz tutuş',['2–3'][0],'6–8','S.K.'],['Triceps düz demirle',3,'6–8','Ağır-orta'],['Triceps iple (hissederek)',3,'8–10','Orta-hafif'],['Omuz yana açış',3,'12','Orta-hafif']])},
gogus:{name:'Göğüs + Biceps + Omuz',ex:x([['Incline bench press',3,'5–6','Ağır'],['Incline dumbbell press (hissederek)',['2–3'][0],'5–8','Ağır'],['Sehpada arkaya doğru dumbbell uzatma',3,'6–8','Orta'],['Cable fly',3,'10–12','Orta-hafif'],['Biceps demire yaslanıp tek kol dumbbell (drop set)',2,M,oh],['İsteğe bağlı biceps hareketi',['2–3'][0],'Serbest','Serbest'],['Dips',2,M,M],['Omuz yana açış',3,'10–12','Orta-hafif']])},
kol:{name:'Kol Antrenmanı (tam)',ex:x([['Z bar biceps (PR denemesi olabilir)',['3–4'][0],'5–6',M],['Düz bar biceps geniş tutuş (2 set ağır, 1 set orta)',3,'6–10','Ağır / orta'],['Omuz dumbbell press',3,'5–8',oa],['Omuz yana açış',3,'8–12','Orta-hafif'],['Triceps düz bar',2,'5–8',oa],['Triceps düz demiri ileri itme (hissederek)',3,'8–10','Orta-hafif'],['Triceps iple ileri itme',3,'8–10','Orta-hafif'],['Triceps aşağıdan yukarı iple',2,'10–12','Hafif'],['Ters Z bar hammer (2 set ağır, 1 set hissederek)',3,M,'Ağır / orta'],['Dumbbell hammer',3,'5–8',oa]])},
bacak:{name:'Bacak',ex:x(bac)},
masa:{name:'Masa Antrenmanı',note:'Maç yoğunluğu varsayılan %70–80.',ex:x([['Teknik çalışma',1,'—','—'],['İç çekiş',1,'—','—'],['Dış çekiş',1,'—','—'],['Başlangıç ve patlayıcılık',1,'—','—'],['Savunma',1,'—','—'],['Kontrollü maçlar (%70–80)',1,'—','%70–80']])},
dinlen:{name:'Toparlanma',ex:[]}}}
let _u=0;function uid(){return 'x'+Date.now().toString(36)+(_u++)}
const W=[['bilek','gogus','rotasyon','sirt','kol','masa','dinlen'],['basinc','gogus','onbilek','sirt','kol','masa','dinlen'],['rotasyon','gogus','bilek','sirt','kol','masa','dinlen'],['onbilek','gogus','basinc','sirt','kol','masa','dinlen']];
function newUser(){const t=today();return{start:add(t,-dow(t)),tpl:mk(),sched:JSON.parse(JSON.stringify(W)),ov:{},dayEx:{},logs:{},runs:[],hist:[]}}
try{const _r=localStorage.getItem('wt2');if(_r&&!localStorage.getItem('wt2_yedek_v2'))localStorage.setItem('wt2_yedek_v2',_r)}catch(e){}
let S;try{S=JSON.parse(localStorage.getItem('wt2'))}catch(e){}
if(!S)S={cur:'e',users:{e:{name:'Enver Murad',...newUser()},b:{name:'Bahtiyar Murad',...newUser()}}};
const U=()=>S.users[S.cur];
const save=()=>localStorage.setItem('wt2',JSON.stringify(S));
const nSets=s=>parseInt(String(s).split(/[–-]/).pop())||1;
function info(d){const u=U();const sm=dn(u.start)-dow(u.start);const wk=(((Math.floor((dn(d)-sm)/7))%4)+4)%4;const base=u.sched[wk][dow(d)];const pid=u.ov[d]||base;return{wk,base,pid,ov:!!u.ov[d]}}
const exOf=(d,pid)=>U().dayEx[d]||U().tpl[pid].ex;
let tab='home',cd=today(),cm=today().slice(0,7),E=null,statEx='';
const TABS=[['home','Ana Sayfa','home'],['cal','Program','cal'],['hist','Gelişim','grow'],['run','Koşu','run'],['set','Ayarlar','set']];
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
let rt=null,rs=0;function rest(){clearInterval(rt);rs=S.rest||90;const e=$('#rest');e.style.display='block';
 const f=()=>e.innerHTML=`Dinlenme <b>${Math.floor(rs/60)}:${pad(rs%60)}</b> <button class="b" onclick="rs+=30">+30 sn</button> <button class="b" onclick="clearInterval(rt);$('#rest').style.display='none'">Kapat</button>`;f();
 rt=setInterval(()=>{rs--;if(rs<0){clearInterval(rt);e.style.display='none';toast('Dinlenme bitti, sıradaki set!');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(x){}return}f()},1000)}
function go(t){tab=t;E=null;cx=null;render()}
function openDay(d){cd=d;tab='day';E=null;cx=null;render();scrollTo(0,0);try{navigator.wakeLock?.request('screen').catch(()=>{})}catch(x){}}
function lastW(name,before,f='w'){let r='';Object.keys(U().logs).sort().forEach(d=>{if(d>=before)return;Object.values(U().logs[d].ex).forEach(e=>{if(e.n===name){const s=[...e.sets].reverse().find(x=>x&&x.d&&x[f]);if(s)r=s[f]}})});return r}

  tips.push({t:'agri',title:'Ağrı kaydı olan bölgeler',body:`${painHi.map(x=>x.sd+x.n).join(', ')} bölgesinde hem yük hem ağrı kaydı var. Ağrı artarsa ilgili hareketleri azaltın veya atlayın; gerekirse uzmana danışın. Bu bir teşhis değildir.`})}
 // Dengesizlik
 if(imb.length){tips.push({t:'denge',title:'Sağ / Sol dengesizlik',body:imb.map(x=>`<b>${x.n}</b>: ${x.stronger} taraf daha yüksek yük almış (${x.d} set fark). Zayıf tarafa tek taraflı (unilateral) çalışma veya daha kontrollü tempo eklenebilir.`).join('<br>')})}
 // Bilek güreşi özel
 const aw=['Bilek','Ön kol','Dirsek','Biceps'],awHi=L.filter(x=>aw.includes(x.n)&&x.s7>=mx*0.4&&x.s7>2);
 if(awHi.length){tips.push({t:'aw',title:'Bilek güreşi odaklı not',body:`${awHi.map(x=>x.sd+x.n).join(', ')} yüksek yük altında. Bilek ve ön kol için 48–72 saat toparlanma, eklem mobilitesi ve kontrollü pronasyon/supinasyon çalışmaları faydalı olabilir. Masa gününden hemen önce aşırı yorgunluk bırakmamaya dikkat edin.`})}
 // Düşük / ihmal
 const low=['Sırt','Göğüs','Quadriceps','Hamstring'].filter(n=>!L.some(x=>x.n===n&&x.s7>=3));
 if(low.length&&L.some(x=>x.s7>0)){tips.push({t:'eksik',title:'Düşük kayıtlı bölgeler',body:`${low.join(', ')} için son 7 günde düşük veya hiç set kaydı yok. Program dengesini kontrol edin; bu bölgeler de genel performansı ve sakatlanma riskini etkiler.`})}
 // Genel olumlu
 if(!tips.length&&L.some(x=>x.s7>0)){tips.push({t:'ok',title:'Dengeli görünüm',body:'Son 7 günlük kayıtlara göre belirgin aşırı yük veya dengesizlik sinyali yok. Mevcut planı sürdürebilir, toparlanma ve beslenmeye dikkat etmeye devam edebilirsiniz.'})}
 if(!L.some(x=>x.s7>0)){tips.push({t:'bos',title:'Henüz veri yok',body:'Öneri üretebilmek için antrenmanlarda setleri işaretleyip kaydetmeniz yeterli. Birkaç antrenman sonrası bölgesel öneriler burada görünecek.'})}
 const icon={yüksek:'⚠️',agri:'🔴',denge:'⚖️',aw:'💪',eksik:'📉',ok:'✅',bos:'ℹ️'};
 return`<div class="card" style="border-left:4px solid #6366f1"><b>Bölgesel Öneriler</b><div class="m" style="margin:4px 0 10px">Kayıtlı yüke göre otomatik üretilir. Kişisel tıbbi tavsiye yerine geçmez.</div>
  ${tips.map(x=>`<div style="margin-top:10px;padding:10px 12px;background:var(--p2);border-radius:12px"><div style="font-weight:700;margin-bottom:4px">${icon[x.t]||'•'} ${x.title}</div><div style="font-size:14px;line-height:1.45">${x.body}</div></div>`).join('')}
 </div>`}
function bolgeTab(){const L=regionLoad(U(),today()),mx=Math.max(1,...L.map(x=>x.s7));
 const legend=`<div class="row" style="gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0 4px;font-size:12px">
  <span><i class="dot" style="background:#3a3a48"></i>Veri yok</span>
  <span><i class="dot" style="background:#35d07f"></i>Düşük</span>
  <span><i class="dot" style="background:#84cc16"></i>Orta-düşük</span>
  <span><i class="dot" style="background:#eab308"></i>Orta</span>
  <span><i class="dot" style="background:#f97316"></i>Yüksek</span>
  <span><i class="dot" style="background:#ef4444"></i>Çok yüksek</span>
 </div>`;
 return bolgeSuggestions(L)+`<div class="card"><div class="row"><b>İnteraktif Kas Haritası</b><div class="sp"></div>
  <div class="seg" style="margin:0;max-width:200px"><button class="${anatView==='front'?'on':''}" onclick="anatView='front';render(true)">Ön</button><button class="${anatView==='back'?'on':''}" onclick="anatView='back';render(true)">Arka</button></div></div>
  <div class="m" style="margin:6px 0 10px">Kas bölgelerine dokunarak detay gör. Renkler son 7 günlük kayıtlı set yükünü temsil eder; sakatlık veya toparlanma ölçümü değildir.</div>
  ${anatSVG(L)}${legend}
  ${selMus?musDetail(selMus):'<div class="m" style="text-align:center;margin-top:8px">Bir kas bölgesi seçin</div>'}
 </div>`+bolgeTab0()}
function dayView(d){return dayView0(d)+dayInfo(d)}
/*ENDV3*/
normS(S);save();
/*ENDUI*/

render();
</script></body></html>

<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Antrenman Paneli</title>
<style>
:root{color-scheme:dark;--bg:#07070d;--p:#ffffff0e;--p2:#ffffff16;--l:#ffffff1c;--t:#f5f5fa;--m:#9b9cb2;--r:24px;--sh:none;--g:#35d07f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(900px 520px at 8% -8%,#4f46e566,transparent 60%),radial-gradient(700px 480px at 100% 0,#ec489940,transparent 55%),var(--bg);background-attachment:fixed;color:var(--t);font:15px/1.5 ui-rounded,"SF Pro Rounded","Segoe UI Variable","Segoe UI",system-ui,sans-serif;letter-spacing:-.011em;font-variant-numeric:tabular-nums}
#app{display:block;min-height:100vh}
nav{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:4px;padding:12px 28px;background:#07070dcc;backdrop-filter:blur(18px);border-bottom:1px solid var(--l)}
nav b{font-size:18px;font-weight:800;padding-right:18px;letter-spacing:-.03em}
nav button{display:flex;gap:8px;align-items:center;background:none;border:0;color:var(--m);padding:9px 14px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer}
nav button i{font-style:normal;font-size:16px}nav button:hover{color:var(--t)}nav button.on{background:var(--t);color:#07070d}
.who{margin-left:auto;display:flex;gap:8px;align-items:center;padding:5px 14px 5px 5px;border-radius:99px;background:var(--p2);cursor:pointer;font-weight:600;font-size:13px}
.who i{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#ec4899);display:grid;place-items:center;font-style:normal;font-weight:800}
main{padding:28px 28px 60px;max-width:1000px;margin:0 auto;width:100%}
h1{font-size:34px;line-height:1.05;margin:0 0 8px;letter-spacing:-.04em;font-weight:800}h2{font-size:13px;margin:28px 0 10px;color:var(--m);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.card{background:var(--p);border:1px solid var(--l);border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:var(--sh)}
.card>.row>b{font-size:16px}
.hero{--c:#777;position:relative;color:#fff;border:0;padding:22px;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 58%,#000),color-mix(in srgb,var(--c) 28%,#000))}
.hero h1{font-size:34px;color:#fff;padding-right:104px}.hero>.m{color:#ffffffbd;padding-right:104px}.hero .m{color:#ffffffbd}
.hero .pri{background:#fff;color:#111;border-color:#fff}.hero .chip{background:#fff3!important;color:#fff}
.ring{position:absolute;right:20px;top:20px;width:88px;height:88px;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),#ffffff30 0);display:grid;place-content:center;text-align:center;line-height:1.1}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:color-mix(in srgb,var(--c) 40%,#000)}
.ring b,.ring span{position:relative}.ring b{font-size:24px;font-weight:800}.ring span{font-size:10px;opacity:.8}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.m{color:var(--m);font-size:13px}
button.b,select,input,textarea{font:inherit;font-size:15px;background:var(--p2);color:var(--t);border:1px solid transparent;border-radius:14px;padding:9px 14px;min-height:42px}
button.b{cursor:pointer;font-weight:600;border-radius:99px}button.b:hover{border-color:var(--m)}button.b:active{transform:scale(.97)}
button.pri{background:var(--t);color:var(--bg);font-weight:700}
input[type=number],input.s{width:84px;text-align:center;font-size:17px;font-weight:700}input.w{width:100%}
input[type=checkbox]{appearance:none;width:30px;height:30px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--m);background:none;cursor:pointer;display:grid;place-items:center}
input[type=checkbox]:checked{background:var(--g);border-color:var(--g)}input[type=checkbox]:checked::after{content:"✓";color:#fff;font-weight:800;font-size:16px}
input[type=radio]{accent-color:var(--t)}
.chip{display:inline-block;padding:3px 12px;border-radius:99px;font-size:12px;color:#111;font-weight:700}
.chip.ink{background:var(--t);color:var(--bg)}.chip.soft{background:var(--p2);color:var(--t)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
table{border-collapse:collapse;width:100%}td,th{padding:6px 4px;text-align:left;font-weight:400}tr+tr td{border-top:1px solid var(--l)}td:first-child{width:34px;color:var(--m);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal div{border-radius:14px;padding:8px 6px;min-height:66px;font-size:11px;cursor:pointer;border:2px solid transparent;overflow:hidden;line-height:1.25}
.cal div b{font-size:15px}.cal .h{min-height:0;cursor:default;color:var(--m);text-align:center;padding:2px;background:none!important;border:0!important}
.cal .td{border-color:var(--t)}.cal .ok{box-shadow:inset 0 0 0 2px var(--g)}
.wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.wk select{width:100%;margin:2px 0 6px}
.warn{border-left:4px solid #f5a524;background:color-mix(in srgb,#f5a524 16%,var(--p));padding:10px 14px;border-radius:14px;margin:10px 0;font-size:13px}
.warn.ok{border-color:var(--g);background:color-mix(in srgb,var(--g) 16%,var(--p))}
.bar{height:10px;background:var(--p2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--t);border-radius:99px;transition:width .3s}
textarea{width:100%;resize:vertical}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:var(--t);color:var(--bg);padding:11px 18px;border-radius:99px;display:none;z-index:9;font-weight:700;box-shadow:0 10px 30px #0005}
#rest{position:fixed;right:14px;bottom:100px;background:var(--p);color:var(--t);border:1px solid var(--l);padding:10px 14px;border-radius:20px;display:none;z-index:8;font-size:16px;box-shadow:0 10px 30px #0004}
.exrow{display:flex;gap:14px;align-items:center;background:var(--p);border:1px solid var(--l);border-radius:20px;padding:14px 16px;margin-bottom:8px;cursor:pointer;box-shadow:var(--sh)}
.exrow:hover{border-color:var(--m)}.exrow.fin{opacity:.55}.exrow .en{font-weight:700;font-size:15px;line-height:1.3}
.ix{width:38px;height:38px;border-radius:50%;background:var(--p2);display:grid;place-items:center;font-weight:800;flex:none}.fin .ix{background:var(--g);color:#fff}
.dts{display:flex;gap:4px;flex:none}.dt{width:9px;height:9px;border-radius:50%;background:var(--l)}.dt.on{background:var(--g)}
.setc.dn{border-color:color-mix(in srgb,var(--g) 50%,var(--l));background:color-mix(in srgb,var(--g) 10%,var(--p))}.sb{font-weight:800;font-size:17px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.stp{display:flex;gap:6px;margin-top:4px}.stp button{width:48px;min-height:54px;font-size:22px;padding:0;flex:none;border-radius:16px}
.stp input{flex:1;min-width:0;width:100%;min-height:54px;font-size:21px;font-weight:800;text-align:center;padding:0}
.setc input[type=checkbox]{width:46px;height:46px}.setc input[type=checkbox]:checked::after{font-size:25px}
summary{cursor:pointer;font-weight:700}details .row{margin-top:8px}
.side{margin-top:12px;padding-top:10px;border-top:1px solid var(--l)}.sl{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--m)}
.sld{margin:12px 0}.sld input[type=range]{width:100%;padding:0;min-height:30px;accent-color:var(--t);border:0;background:none}
.fl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.fl button{min-height:38px;padding:5px 12px;font-size:13px}.fl button.on{background:var(--t);color:var(--bg)}.fl button.pn.on{background:#ff5a5a;color:#111}
:focus-visible{outline:3px solid var(--t);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:760px){#app{display:block}
nav{position:fixed;bottom:10px;left:10px;right:10px;top:auto;height:auto;display:flex;padding:6px;border:1px solid var(--l);border-radius:28px;z-index:5;background:color-mix(in srgb,var(--p) 86%,transparent);backdrop-filter:blur(18px);box-shadow:0 10px 30px #0003;margin-bottom:env(safe-area-inset-bottom)}
nav b{display:none}nav button{flex-direction:column;gap:1px;text-align:center;padding:7px 0;font-size:10px;flex:1;margin:0;border-radius:20px}nav button i{font-size:19px}
main{padding:20px 14px 120px}h1,.hero h1{font-size:28px}.hero h1,.hero>.m{padding-right:92px}.ring{width:76px;height:76px}.ring b{font-size:20px}
input[type=number],input.s{width:72px}.cal div{min-height:54px;font-size:10px;padding:5px 3px}#toast,#rest{bottom:104px}}

option{background:#14141f;color:#f5f5fa}.card,.exrow{backdrop-filter:blur(14px)}#rest{background:#1a1a26}
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.bento>*{margin:0}.s6{grid-column:span 6}.s2{grid-column:span 2}
.tile{cursor:pointer}.tile .big{font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:6px 0 2px}.tile .big small{font-size:15px;color:var(--m);font-weight:600}
.pv{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.pv span{background:#fff2;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:600}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.pill{padding:10px 2px;text-align:center;border-radius:18px;background:var(--p);border:1px solid var(--l);cursor:pointer;font-size:11px;color:var(--m);backdrop-filter:blur(14px)}
.pill b{display:block;font-size:18px;color:var(--t);margin:2px 0}.pill i{display:block;width:8px;height:8px;border-radius:50%;margin:4px auto 0}.pill.td{border-color:var(--t)}.pill.ok{background:color-mix(in srgb,var(--g) 18%,transparent)}
@media(max-width:760px){.bento{grid-template-columns:1fr 1fr}.s6,.s2.w{grid-column:span 2}.s2{grid-column:span 1}.strip{gap:4px}nav{background:#14141fe6!important}.who{display:none}}

nav button i{display:grid;place-items:center}
.seg{display:flex;gap:4px;padding:4px;background:var(--p2);border-radius:99px;margin:6px 0 18px;width:100%;max-width:440px}
.seg button{flex:1;border:0;background:none;color:var(--m);padding:8px;border-radius:99px;font:inherit;font-weight:700;cursor:pointer;min-height:42px}.seg button.on{background:var(--t);color:#07070d}
@media(max-width:760px){nav{left:8px;right:8px;padding:6px 4px}nav button{padding:8px 0;font-size:11px;gap:3px}nav button svg{width:24px;height:24px}.seg{max-width:none}.wk{grid-template-columns:1fr 1fr}.card{padding:14px}}
</style></head><body>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Istanbul'});
const dn=s=>{const[y,m,d]=s.split('-');return Date.UTC(y,m-1,d)/864e5};
const add=(s,n)=>new Date((dn(s)+n)*864e5).toISOString().slice(0,10);
const dow=s=>(new Date(dn(s)*864e5).getUTCDay()+6)%7; // Pazartesi=0
const GUN=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const AY=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const SAAT=['18:30–20:30','Okul sonrası','18:30–20:30','18:40 sonrası','18:40 sonrası','18:30–20:30','Dinlenme / koşu'];
const COL={bilek:'#4f8cff',basinc:'#ff5a5a',onbilek:'#a46bff',rotasyon:'#ff9a3c',gogus:'#4cc36b',sirt:'#31cfd8',kolbacak:'#f2d03b',kol:'#f2d03b',bacak:'#c9b02e',masa:'#ff7ac0',dinlen:'#8a8a92'};
const WARN={basinc:'Side pressure: dirsek ve üst kolda yüksek yük oluşur. Isınmayı atlama.',sirt:'Ağır sırt çalışması ertesi günkü rotasyon/bilek antrenmanını etkileyebilir.',kolbacak:'Cumartesi masa antrenmanı var: kol hacmi bilerek azaltıldı.',kol:'Tam kol programı cumartesi masa performansını etkileyebilir.',onbilek:'Ağır biceps çalışmasından sonra ön bilek için toparlanmaya dikkat et.'};
function mk(){const x=(a)=>a.map(([n,s,r,l])=>({id:uid(),n,s,r,l}));
const M='Maksimum',oh='Orta-hafif',oa='Orta-ağır',ao='Ağır-orta';
const bac=[['Squat veya leg press',3,'4–6','Ağır'],['Romanian deadlift',3,'6–8','Orta-ağır'],['Leg curl',3,'8–12','Orta'],['Calf raise',3,'10–15','Orta']];
const kolHafif=[['Z bar biceps',2,'8–10','Hafif-orta'],['Triceps iple',2,'10–12','Hafif-orta']];
return{
bilek:{name:'Bilek Antrenmanı',ex:x([['İstasyonda bilek rotasyonda lastik ekle, yerinde içe döndür',4,M,oh],['Sehpada bilek',4,M,oa],['İstasyonda parmak',4,M,oh],['Yerden sırta bilek döndürerek dumbbell kaldırma',4,M,oa],['İstasyonda lastikle içe hızlı yuvarlama',4,M,oh],['İstasyonda iple eklem',4,M,oa],['İstasyonda ters basınç',4,'4–6',M],['Statik ağırlıklı barfiks (2 set ağırlıklı, 1 set ağırlıksız)',3,'Statik',M]])},
basinc:{name:'Basınç Antrenmanı',ex:x([['İstasyonda lastikle yana yuvarlama',4,M,oa],['Demir çubukla iple aşağıdan yukarı basınç',4,M,oa],['İstasyonda iple eklem',4,M,oa],['Parmak',4,M,M],['İstasyonda çaprazdan iple statik',4,'1',ao],['İstasyonda üstüne çıkıp yana basınç',4,M,ao]])},
onbilek:{name:'Ön Bilek Antrenmanı',ex:x([['İstasyonda karşıdan iki ipi kemiğin arasına alıp lastikle ön bilekten kendine çekme',4,M,oa],['Yerden iple ön bilek',4,'4–8',oa],['İstasyonda çapraz koyup iple kemik hizasından basma',4,M,oa],['Yerden iple kemik hizasından bilek rotasyonu ekleyerek dış çekiş',4,M,oa],['İstasyonda dış aletiyle yuvarlayıp ön bileği salıp yuvarlama',4,M,oh],['Parmak',4,M,M],['Ağırlıklı barfiks, statik hammer tutuş (2 set ağırlıklı, 1 set ağırlıksız)',3,'Statik',M]])},
rotasyon:{name:'Rotasyon Antrenmanı',ex:x([['İstasyonda içe yuvarlama aleti ve lastikle kendine çekerek dış rotasyon',4,M,oa],['İple rotasyon, bilek hizasına destek koyarak',4,M,'Hafif-orta'],['İstasyonda yan pozisyonda karşıdan lastikle çekerek yana yatış',4,M,oa],['İple hammer',4,M,ao],['Parmak',4,M,oa],['İstasyonda karşıdan çekerek savunma rotasyonu',4,M,oa]])},
sirt:{name:'Sırt + Triceps + Omuz',ex:x([['Lat pulldown',3,'6–8','S.K.'],['Üstten yakın tutuş demirle çekiş',3,'6–8','S.K.'],['Karşıdan düz yakın tutuş demirle çekiş',2,'6–8','S.K.'],['Row düz tutuş',['2–3'][0],'6–8','S.K.'],['Triceps düz demirle',3,'6–8','Ağır-orta'],['Triceps iple (hissederek)',3,'8–10','Orta-hafif'],['Omuz yana açış',3,'12','Orta-hafif']])},
gogus:{name:'Göğüs + Biceps + Omuz',ex:x([['Incline bench press',3,'5–6','Ağır'],['Incline dumbbell press (hissederek)',['2–3'][0],'5–8','Ağır'],['Sehpada arkaya doğru dumbbell uzatma',3,'6–8','Orta'],['Cable fly',3,'10–12','Orta-hafif'],['Biceps demire yaslanıp tek kol dumbbell (drop set)',2,M,oh],['İsteğe bağlı biceps hareketi',['2–3'][0],'Serbest','Serbest'],['Dips',2,M,M],['Omuz yana açış',3,'10–12','Orta-hafif']])},
kol:{name:'Kol Antrenmanı (tam)',ex:x([['Z bar biceps (PR denemesi olabilir)',['3–4'][0],'5–6',M],['Düz bar biceps geniş tutuş (2 set ağır, 1 set orta)',3,'6–10','Ağır / orta'],['Omuz dumbbell press',3,'5–8',oa],['Omuz yana açış',3,'8–12','Orta-hafif'],['Triceps düz bar',2,'5–8',oa],['Triceps düz demiri ileri itme (hissederek)',3,'8–10','Orta-hafif'],['Triceps iple ileri itme',3,'8–10','Orta-hafif'],['Triceps aşağıdan yukarı iple',2,'10–12','Hafif'],['Ters Z bar hammer (2 set ağır, 1 set hissederek)',3,M,'Ağır / orta'],['Dumbbell hammer',3,'5–8',oa]])},
bacak:{name:'Bacak',ex:x(bac)},
masa:{name:'Masa Antrenmanı',note:'Maç yoğunluğu varsayılan %70–80.',ex:x([['Teknik çalışma',1,'—','—'],['İç çekiş',1,'—','—'],['Dış çekiş',1,'—','—'],['Başlangıç ve patlayıcılık',1,'—','—'],['Savunma',1,'—','—'],['Kontrollü maçlar (%70–80)',1,'—','%70–80']])},
dinlen:{name:'Toparlanma',ex:[]}}}
let _u=0;function uid(){return 'x'+Date.now().toString(36)+(_u++)}
const W=[['bilek','gogus','rotasyon','sirt','kol','masa','dinlen'],['basinc','gogus','onbilek','sirt','kol','masa','dinlen'],['rotasyon','gogus','bilek','sirt','kol','masa','dinlen'],['onbilek','gogus','basinc','sirt','kol','masa','dinlen']];
function newUser(){const t=today();return{start:add(t,-dow(t)),tpl:mk(),sched:JSON.parse(JSON.stringify(W)),ov:{},dayEx:{},logs:{},runs:[],hist:[]}}
let S;try{S=JSON.parse(localStorage.getItem('wt2'))}catch(e){}
if(!S)S={cur:'e',users:{e:{name:'Enver Murad',...newUser()},b:{name:'Bahtiyar Murad',...newUser()}}};
const U=()=>S.users[S.cur];
const save=()=>localStorage.setItem('wt2',JSON.stringify(S));
const nSets=s=>parseInt(String(s).split(/[–-]/).pop())||1;
function info(d){const u=U();const sm=dn(u.start)-dow(u.start);const wk=(((Math.floor((dn(d)-sm)/7))%4)+4)%4;const base=u.sched[wk][dow(d)];const pid=u.ov[d]||base;return{wk,base,pid,ov:!!u.ov[d]}}
const exOf=(d,pid)=>U().dayEx[d]||U().tpl[pid].ex;
let tab='home',cd=today(),cm=today().slice(0,7),E=null,statEx='';
const TABS=[['home','Ana Sayfa','home'],['cal','Program','cal'],['hist','Gelişim','grow'],['run','Koşu','run'],['set','Ayarlar','set']];
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
let rt=null,rs=0;function rest(){clearInterval(rt);rs=S.rest||90;const e=$('#rest');e.style.display='block';
 const f=()=>e.innerHTML=`Dinlenme <b>${Math.floor(rs/60)}:${pad(rs%60)}</b> <button class="b" onclick="rs+=30">+30 sn</button> <button class="b" onclick="clearInterval(rt);$('#rest').style.display='none'">Kapat</button>`;f();
 rt=setInterval(()=>{rs--;if(rs<0){clearInterval(rt);e.style.display='none';toast('Dinlenme bitti, sıradaki set!');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(x){}return}f()},1000)}
function go(t){tab=t;E=null;cx=null;render()}
function openDay(d){cd=d;tab='day';E=null;cx=null;render();scrollTo(0,0);try{navigator.wakeLock?.request('screen').catch(()=>{})}catch(x){}}
function lastW(name,before,f='w'){let r='';Object.keys(U().logs).sort().forEach(d=>{if(d>=before)return;Object.values(U().logs[d].ex).forEach(e=>{if(e.n===name){const s=[...e.sets].reverse().find(x=>x&&x.d&&x[f]);if(s)r=s[f]}})});return r}
function maxW(name,before){let m=0;Object.keys(U().logs).forEach(d=>{if(before&&d>=before)return;Object.values(U().logs[d].ex).forEach(e=>{if(e.n===name)e.sets.forEach(x=>{if(x&&x.d)m=Math.max(m,+x.w||0,+x.w2||0)})})});return m}

function stat(){const u=U(),t=today(),mon=add(t,-dow(t));let rows='',mx=1;const wk=[];for(let k=3;k>=0;k--){const a=add(mon,-7*k);let s=0,r=0,v=0,w=0;for(let j=0;j<7;j++){const x=sumOf(add(a,j));s+=x.s;r+=x.r;v+=x.v;if(x.s)w++}wk.push({a,s,r,v,w});mx=Math.max(mx,s)}
 rows=wk.map(x=>`<tr><td>${x.a.slice(5)}</td><td>${x.w}</td><td>${x.s}<div class="bar"><i style="width:${x.s/mx*100}%"></i></div></td><td>${x.r}</td><td>${Math.round(x.v)}</td></tr>`).join('');
 const names={},best={};Object.values(u.logs).forEach(l=>Object.values(l.ex).forEach(e=>e.sets.forEach(s=>{if(s&&s.d&&(+s.w||+s.w2)){names[e.n]=1;best[e.n]=Math.max(best[e.n]||0,+s.w||0,+s.w2||0)}})));
